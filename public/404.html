<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halaman Tidak Ditemukan - Vincent Pay</title>
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div class="bg-decor"><div class="bg-blob bg-blob-1"></div><div class="bg-blob bg-blob-2"></div></div>
<div class="grid-pattern"></div>

<div style="position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2rem 1.25rem; text-align:center;">
  <div class="badge-pill" style="margin-bottom:1.25rem;">
    <span class="badge-dot" style="background:#f59e0b; box-shadow:0 0 0 3px rgba(245,158,11,.18);"></span>
    <span>Error 404</span>
  </div>
  <h1 style="font-size:2rem; font-weight:600; color:var(--slate-900); letter-spacing:-.03em;">404</h1>
  <p style="font-size:13px; color:var(--slate-600); margin-top:.6rem; max-width:24rem; line-height:1.7;">
    Halaman yang Anda cari tidak ditemukan atau sudah dipindahkan.
  </p>
  <div style="display:flex; gap:.6rem; margin-top:1.5rem;">
    <a href="/" class="btn-primary" style="font-size:12.5px;">
      <i class="fas fa-house" style="font-size:11px;"></i> Ke Beranda
    </a>
    <a href="/dashboard" class="btn-secondary" style="font-size:12.5px;">Dashboard</a>
  </div>
</div>

</html>
