<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Vincent Pay</title>
  <meta name="theme-color" content="#9333ea">
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div class="dash-shell" id="shell"></div>

<script src="/js/app.js"></script>
<script src="/js/dashboard.js"></script>
<script>
  bootDashboard('dashboard', 'Dashboard', async () => {
    const c = document.getElementById('content');
    c.innerHTML = `<div style="text-align:center; padding:3rem; color:var(--slate-400); font-size:13px;">
      <i class="fas fa-spinner fa-spin"></i> Memuat data...</div>`;

    let stats, trx;
    try {
      [stats, trx] = await Promise.all([
        api('/api/user/stats'),
        api('/api/transactions?limit=5')
      ]);
    } catch (e) {
      c.innerHTML = `<div class="alert alert-error">${e.message}</div>`;
      return;
    }

    const u = Store.user;

    c.innerHTML = `
      <div style="margin-bottom:1.25rem;">
        <h1 style="font-size:1.15rem; font-weight:600; color:var(--slate-900);">Halo, ${u.username} 👋</h1>
        <p style="font-size:12px; color:var(--slate-500); margin-top:.25rem;">Ringkasan akun dan aktivitas pembayaran Anda.</p>
      </div>

      <!-- saldo + aksi -->
      <div style="display:grid; grid-template-columns:1fr; gap:1rem; margin-bottom:1.25rem;" id="topGrid">
        <div class="balance-card">
          <p class="balance-label">Saldo Tersedia</p>
          <p class="balance-value">${rupiah(u.balance)}</p>
          <div style="display:flex; gap:1.5rem; margin-top:.85rem; position:relative; z-index:1;">
            <div>
              <p style="font-size:10.5px; opacity:.75;">Menunggu proses</p>
              <p style="font-size:13px; font-weight:500; margin-top:.1rem;">${rupiah(u.pending_balance)}</p>
            </div>
            <div>
              <p style="font-size:10.5px; opacity:.75;">Total Deposit</p>
              <p style="font-size:13px; font-weight:500; margin-top:.1rem;">${rupiah(stats.deposit_total)}</p>
            </div>
          </div>
          <div style="display:flex; gap:.55rem; margin-top:1.1rem; position:relative; z-index:1;">
            <a href="/deposit" style="background:#fff; color:#7e22ce; border-radius:8px; padding:.45rem .8rem; font-size:11.5px; font-weight:600; text-decoration:none;">
              <i class="fas fa-plus" style="font-size:10px;"></i> Deposit
            </a>
            <a href="/withdraw" style="background:rgba(255,255,255,.16); color:#fff; border:1px solid rgba(255,255,255,.3); border-radius:8px; padding:.45rem .8rem; font-size:11.5px; font-weight:500; text-decoration:none;">
              <i class="fas fa-arrow-up" style="font-size:10px;"></i> Tarik Saldo
            </a>
          </div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:.85rem;">
          <div class="stat-card">
            <p style="font-size:11px; color:var(--slate-500); font-weight:500;">Transaksi Hari Ini</p>
            <p style="font-size:1.1rem; font-weight:600; color:var(--slate-900); margin-top:.25rem;">${stats.today_count}</p>
            <p style="font-size:10.5px; color:var(--slate-400); margin-top:.2rem;">${rupiah(stats.today_total)}</p>
          </div>
          <div class="stat-card">
            <p style="font-size:11px; color:var(--slate-500); font-weight:500;">Total Transaksi</p>
            <p style="font-size:1.1rem; font-weight:600; color:var(--slate-900); margin-top:.25rem;">${stats.total_transactions}</p>
            <p style="font-size:10.5px; color:var(--slate-400); margin-top:.2rem;">${stats.pending_count} menunggu</p>
          </div>
          <div class="stat-card">
            <p style="font-size:11px; color:var(--slate-500); font-weight:500;">Total Deposit</p>
            <p style="font-size:1.1rem; font-weight:600; color:var(--slate-900); margin-top:.25rem;">${rupiah(stats.deposit_total)}</p>
          </div>
          <div class="stat-card">
            <p style="font-size:11px; color:var(--slate-500); font-weight:500;">Total Penarikan</p>
            <p style="font-size:1.1rem; font-weight:600; color:var(--slate-900); margin-top:.25rem;">${rupiah(stats.withdraw_total)}</p>
          </div>
        </div>
      </div>

      <!-- API key -->
      <div class="dash-card" style="margin-bottom:1.25rem;">
        <div class="dash-card-header">
          <div style="display:flex; align-items:center; gap:.5rem;">
            <div class="icon-box icon-purple"><i class="fas fa-key"></i></div>
            <span>API Key Anda</span>
          </div>
          <a href="/profile" style="font-size:11.5px; color:var(--brand); text-decoration:none;">Kelola</a>
        </div>
        <div class="dash-card-body">
          <div style="display:flex; gap:.5rem; align-items:center; flex-wrap:wrap;">
            <code id="apiKeyValue" style="flex:1; min-width:200px; font-family:ui-monospace,monospace; font-size:11.5px; color:var(--slate-700); background:var(--slate-50); border:1px solid var(--slate-200); padding:.5rem .7rem; border-radius:8px; overflow-x:auto; white-space:nowrap;">
              ${u.api_key || '-'}
            </code>
            <button class="btn-secondary" style="font-size:11.5px; padding:.5rem .7rem;" onclick="copyText('${u.api_key || ''}', this)">
              <i class="fas fa-copy" style="font-size:10px;"></i> Copy
            </button>
          </div>
          <p style="font-size:11px; color:var(--slate-400); margin-top:.6rem;">
            Jangan bagikan API key Anda. <a href="/docs" class="link-brand" style="font-size:11px;">Baca dokumentasi</a>
          </p>
        </div>
      </div>

      <!-- transaksi terakhir -->
      <div class="dash-card">
        <div class="dash-card-header">
          <div style="display:flex; align-items:center; gap:.5rem;">
            <div class="icon-box icon-violet"><i class="fas fa-receipt"></i></div>
            <span>Transaksi Terakhir</span>
          </div>
          <a href="/transactions" style="font-size:11.5px; color:var(--brand); text-decoration:none;">Lihat semua</a>
        </div>
        <div class="table-responsive">
          <table class="data-table">
            <thead><tr><th>ID</th><th>Tipe</th><th>Nominal</th><th>Status</th><th>Waktu</th></tr></thead>
            <tbody>
              ${trx.data.length ? trx.data.map(t => `
                <tr>
                  <td style="font-family:ui-monospace,monospace; font-size:11px;">
                    <a href="/transactions?open=${t.id}" style="color:var(--brand-600); text-decoration:none;">${t.id}</a>
                  </td>
                  <td>${typeBadge(t.type)}</td>
                  <td style="font-weight:500; color:var(--slate-900);">${rupiah(t.type === 'deposit' ? t.amount : t.amount)}</td>
                  <td>${statusBadge(t.status)}</td>
                  <td style="font-size:11.5px; color:var(--slate-500);">${timeAgo(t.created_at)}</td>
                </tr>`).join('')
                : '<tr><td colspan="5" style="text-align:center; padding:2rem; color:var(--slate-400);">Belum ada transaksi.</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
    `;

    const layout = () => {
      document.getElementById('topGrid').style.gridTemplateColumns = window.innerWidth >= 1024 ? '1.15fr 1fr' : '1fr';
    };
    layout();
    window.addEventListener('resize', layout);
  });
</script>
</body>
</html>
