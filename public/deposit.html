<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Buat QRIS - Vincent Pay</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></head>
<body><div class="dash-shell" id="shell"></div><script src="/js/app.js"></script><script src="/js/dashboard.js"></script><script>
bootDashboard('deposit','Buat QRIS', async () => {
 const c=document.getElementById('content');
 c.innerHTML=`<div style="margin-bottom:1.25rem"><h1 style="font-size:1.2rem;font-weight:650;color:var(--slate-900)">Buat Invoice QRIS</h1><p style="font-size:12px;color:var(--slate-500);margin-top:.3rem">QRIS dibuat lewat API langsung akun merchant yang dikonfigurasi owner.</p></div>
 <div style="display:grid;grid-template-columns:minmax(0,1fr);gap:1.25rem" id="depositGrid"><div class="dash-card"><div class="dash-card-header"><div style="display:flex;align-items:center;gap:.5rem"><div class="icon-box icon-purple"><i class="fas fa-qrcode"></i></div><span>Detail pembayaran</span></div></div><div class="dash-card-body"><div id="alertBox" class="alert alert-error hidden" style="margin-bottom:1rem"><i class="fas fa-circle-exclamation"></i><span id="alertText"></span></div>
 <label class="form-label" style="display:block;font-size:12px;margin-bottom:.45rem">Provider QRIS</label><select id="providerInput" class="form-input" style="margin-bottom:1rem"><option value="dana">DANA Merchant</option><option value="shopeepay">ShopeePay Merchant</option><option value="gopay">GoPay / GoBiz Merchant</option></select>
 <label style="display:block;font-size:12px;margin-bottom:.45rem">Nominal deposit (Rp)</label><input id="amountInput" class="form-input" type="number" min="1000" max="10000000" step="1" value="50000" placeholder="50000"><p id="limitsText" style="font-size:11px;color:var(--slate-400);margin-top:.35rem">Batas nominal mengikuti pengaturan owner.</p>
 <div style="display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.75rem">${[10000,25000,50000,100000,250000].map(v=>`<button type="button" class="btn-secondary preset" data-v="${v}" style="font-size:11px;padding:.35rem .6rem">${rupiah(v)}</button>`).join('')}</div>
 <div style="background:var(--slate-50);border:1px solid var(--slate-200);border-radius:10px;padding:.85rem;margin-top:1rem"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:.4rem"><span>Nominal</span><b id="sumAmount">Rp 50.000</b></div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:.4rem"><span>Biaya platform</span><b id="sumFee">Menghitung…</b></div><div style="border-top:1px dashed var(--slate-300);margin:.5rem 0"></div><div style="display:flex;justify-content:space-between;font-size:13px;font-weight:650"><span>Total dibayar</span><b id="sumTotal">-</b></div></div>
 <button id="createBtn" class="btn-submit" style="margin-top:1rem"><i class="fas fa-qrcode"></i> Buat QRIS</button><p style="font-size:10.5px;color:var(--slate-400);line-height:1.6;margin-top:.75rem">Invoice hanya dibuat jika credential merchant dan produk QRIS provider sudah aktif. Tidak ada tombol simulasi pembayaran.</p></div></div>
 <div class="dash-card" id="resultCard" style="display:none"><div class="dash-card-header">Invoice berhasil dibuat</div><div class="dash-card-body" style="text-align:center"><p id="resultStatus" class="badge badge-pending">Menunggu Pembayaran</p><p id="resultTotal" style="font-size:1.6rem;font-weight:700;margin:.75rem 0"></p><img id="qrisImg" alt="QRIS" style="width:100%;max-width:320px;margin:0 auto;border:1px solid var(--slate-200);border-radius:12px;padding:.5rem"><button id="downloadQris" type="button" class="btn-secondary" style="display:block;width:100%;margin:.7rem 0;font-size:12px"><i class="fas fa-download"></i> Download gambar QRIS</button><p id="resultExpired" style="font-size:11px;color:var(--slate-500);margin:.75rem 0"></p><a id="payLink" class="btn-primary" href="#" target="_blank" rel="noopener">Buka halaman pembayaran</a></div></div></div>`;
 let pricing=null;
 try { pricing=await api('/api/pricing',{auth:false}); } catch(e) { }
 const amount=document.getElementById('amountInput');
 function updateSum(){const v=Math.max(0,Math.round(Number(amount.value)||0));const fixed=Number(pricing?.qris_fee ?? 250);const pct=Number(pricing?.qris_fee_percent ?? 0);const fee=Math.round(fixed+v*pct/100);document.getElementById('sumAmount').textContent=rupiah(v);document.getElementById('sumFee').textContent=rupiah(fee);document.getElementById('sumTotal').textContent=rupiah(v+fee);if(pricing) { amount.min=pricing.deposit_min; amount.max=pricing.deposit_max; document.getElementById('limitsText').textContent=`Minimal ${rupiah(pricing.deposit_min)} · Maksimal ${rupiah(pricing.deposit_max)}`; }}
 amount.addEventListener('input',updateSum);document.querySelectorAll('.preset').forEach(b=>b.addEventListener('click',()=>{amount.value=b.dataset.v;updateSum()}));updateSum();
 document.getElementById('downloadQris').addEventListener('click',async()=>{
   const image=document.getElementById('qrisImg'); if(!image.src) return toast('QRIS belum tersedia.','error');
   const link=document.createElement('a'); link.download='vincent-pay-qris.png';
   try { const response=await fetch(image.src); if(!response.ok) throw new Error('QR image tidak dapat diunduh'); const blob=await response.blob(); const url=URL.createObjectURL(blob); link.href=url; link.click(); setTimeout(()=>URL.revokeObjectURL(url),1500); toast('Unduhan QRIS dimulai.','success'); }
   catch { link.href=image.src; link.target='_blank'; link.rel='noopener'; link.click(); toast('QRIS dibuka untuk disimpan dari browser.',''); }
 });
 document.getElementById('createBtn').addEventListener('click',async()=>{const btn=document.getElementById('createBtn');const box=document.getElementById('alertBox');box.classList.add('hidden');btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Menghubungi merchant…';try{const d=await api('/api/transactions',{method:'POST',body:{amount:Number(amount.value),provider:document.getElementById('providerInput').value}});const t=d.transaction;document.getElementById('qrisImg').src=t.qris_image||'';document.getElementById('resultTotal').textContent=rupiah(t.total);document.getElementById('resultExpired').textContent='Berlaku sampai '+fmtDate(t.expired_at);document.getElementById('payLink').href=t.payment_link;document.getElementById('resultCard').style.display='block';document.getElementById('resultCard').scrollIntoView({behavior:'smooth',block:'center'});toast('Invoice '+t.reference+' dibuat. Status akan diverifikasi dari merchant.','success');}catch(e){document.getElementById('alertText').textContent=e.message;box.classList.remove('hidden')}finally{btn.disabled=false;btn.innerHTML='<i class="fas fa-qrcode"></i> Buat QRIS';}});
 const layout=()=>document.getElementById('depositGrid').style.gridTemplateColumns=window.innerWidth>=1100?'minmax(0,1.1fr) minmax(320px,.9fr)':'minmax(0,1fr)';layout();window.addEventListener('resize',layout);
});
</script></body></html>
