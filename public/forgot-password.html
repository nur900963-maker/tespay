<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Password - Vincent Pay</title>
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div class="bg-decor"><div class="bg-blob bg-blob-1"></div><div class="bg-blob bg-blob-2"></div></div>
<div class="grid-pattern"></div>

<div style="z-index:1; position:relative; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:3rem 1.25rem;">

  <div class="login-card anim-fade-up" style="width:100%; max-width:28rem;">
    <div style="text-align:center; margin-bottom:1.5rem;">
      <img src="/icon.svg" alt="Logo" style="height:3.5rem; margin:0 auto .75rem; border-radius:.5rem; display:block;">
      <h1 style="font-size:1.15rem; font-weight:500; color:var(--slate-900);">Lupa Password</h1>
      <p style="font-size:12px; color:var(--slate-500); margin-top:.375rem;">Masukkan email atau username untuk reset</p>
    </div>

    <div id="alertBox" class="alert alert-error hidden" style="margin-bottom:1rem;"><i class="fas fa-circle-exclamation" style="margin-top:.1rem;"></i><span id="alertText"></span></div>
    <div id="successBox" class="alert alert-success hidden" style="margin-bottom:1rem;"><i class="fas fa-circle-check" style="margin-top:.1rem;"></i><span id="successText"></span></div>

    <form id="forgotForm" style="display:flex; flex-direction:column; gap:1rem;">
      <div>
        <label style="display:block; font-size:12.5px; font-weight:500; color:var(--slate-800); margin-bottom:.5rem;">Email atau Username</label>
        <input id="loginInput" class="form-input" type="text" placeholder="nama@email.com" required>
      </div>
      <p style="font-size:11.5px; color:var(--slate-500); line-height:1.7;">
        Jika owner sudah mengatur SMTP, instruksi pemulihan dikirim lewat email dan berlaku 30 menit.
      </p>
      <button type="submit" class="btn-submit" id="submitBtn">Kirim Link Reset</button>
    </form>

    <p style="text-align:center; font-size:12.5px; color:var(--slate-600); margin-top:1.5rem;">
      Ingat password Anda? <a href="/login" class="link-brand">Masuk di sini</a>
    </p>
  </div>

  <div style="margin-top:1.5rem; text-align:center; display:flex; flex-direction:column; gap:1rem;">
    <a href="/" style="font-size:12.5px; color:var(--slate-500); text-decoration:none;"><i class="fas fa-arrow-left" style="font-size:11px;"></i> Ke Beranda</a>
    <p style="font-size:11.5px; color:var(--slate-400);">Butuh bantuan? <a href="/docs" class="link-brand" style="font-size:12px;">Hubungi pengelola platform</a></p>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  const form = document.getElementById('forgotForm');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    document.getElementById('alertBox').classList.add('hidden');
    document.getElementById('successBox').classList.add('hidden');
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Mengirim...';

    try {
      const res = await fetch('/api/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ login: document.getElementById('loginInput').value.trim() })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Gagal mengirim link reset.');

      document.getElementById('successText').textContent = data.message;
      document.getElementById('successBox').classList.remove('hidden');

      if (data.reset_link) {
        // Hanya tersedia di mode development ketika ALLOW_DEV_RESET_LINK=true.
        toast('Link reset development dibuat.', 'success');
      }
    } catch (err) {
      document.getElementById('alertText').textContent = err.message;
      document.getElementById('alertBox').classList.remove('hidden');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Kirim Link Reset';
    }
  });
</script>
</body>
</html>
