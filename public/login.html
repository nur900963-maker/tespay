<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Vincent Pay</title>
  <meta name="theme-color" content="#9333ea">
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="min-h-screen flex flex-col">

<div class="bg-decor">
  <div class="bg-blob bg-blob-1"></div>
  <div class="bg-blob bg-blob-2"></div>
</div>
<div class="grid-pattern"></div>

<div class="flex-1 flex flex-col justify-center items-center px-5 py-12 relative" style="z-index:1; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:3rem 1.25rem;">

  <div class="login-card w-full max-w-md flex flex-col gap-6 anim-fade-up" style="width:100%; max-width:28rem;">

    <div style="text-align:center;">
      <div style="margin-bottom:.75rem;">
        <img src="/icon.svg" alt="Logo" style="height:3.5rem; width:auto; object-fit:contain; margin:0 auto; border-radius:.5rem;">
      </div>
      <h1 style="font-size:1.15rem; font-weight:500; color:var(--slate-900); letter-spacing:-.01em;">Login Dashboard</h1>
      <p style="font-size:12px; color:var(--slate-500); margin-top:.375rem;">Masuk ke akun Vincent Pay Anda</p>
    </div>

    <div id="alertBox" class="alert alert-error hidden"><i class="fas fa-circle-exclamation" style="margin-top:.1rem;"></i><span id="alertText"></span></div>

    <form id="loginForm" style="display:flex; flex-direction:column; gap:1rem;" autocomplete="on">

      <div>
        <label style="display:block; font-size:12.5px; font-weight:500; color:var(--slate-800); margin-bottom:.5rem;">Email atau Username</label>
        <input name="login" id="loginInput" type="text" placeholder="username" class="form-input" required autocomplete="username">
      </div>

      <div>
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:.5rem;">
          <label style="font-size:12.5px; font-weight:500; color:var(--slate-800);">Password</label>
          <a href="/forgot-password" class="link-muted" style="font-size:12px;">Lupa Password?</a>
        </div>
        <div class="form-input-wrapper">
          <input id="passwordInput" name="password" type="password" placeholder="••••••••" class="form-input" required autocomplete="current-password">
          <button type="button" class="toggle-pass-btn js-toggle-pass" aria-label="Tampilkan password" aria-pressed="false">
            <i class="fas fa-eye" style="font-size:12.5px;"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn" style="margin-top:.5rem;">
        <i class="fas fa-right-to-bracket" style="font-size:12px;"></i>
        <span id="submitText">Masuk</span>
      </button>
    </form>

    <p style="text-align:center; font-size:12.5px; color:var(--slate-600);">
      Belum punya akun?
      <a href="/register" class="link-brand">Daftar sekarang</a>
    </p>


  </div>

  <div style="margin-top:1.5rem; text-align:center; display:flex; flex-direction:column; gap:1rem;" class="anim-fade-up">
    <a href="/" style="font-size:12.5px; color:var(--slate-500); text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:.4rem;">
      <i class="fas fa-arrow-left" style="font-size:11px;"></i> Ke Beranda
    </a>
    <p style="font-size:11.5px; color:var(--slate-400);">
      Butuh bantuan?
      <a href="/docs" class="link-brand" style="font-size:12px; margin-left:.25rem;">Hubungi pengelola platform</a>
    </p>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  const form = document.getElementById('loginForm');
  const alertBox = document.getElementById('alertBox');
  const alertText = document.getElementById('alertText');
  const submitBtn = document.getElementById('submitBtn');
  const submitText = document.getElementById('submitText');

  function showError(msg) {
    alertText.textContent = msg;
    alertBox.classList.remove('hidden');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    alertBox.classList.add('hidden');
    submitBtn.disabled = true;
    submitText.textContent = 'Memproses...';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          login: document.getElementById('loginInput').value.trim(),
          password: document.getElementById('passwordInput').value
        })
      });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.message || 'Login gagal.');

      Store.token = data.token;
      Store.user = data.user;
      toast('Login berhasil. Mengalihkan ke dashboard...', 'success');
      setTimeout(() => location.href = '/dashboard', 500);
    } catch (err) {
      showError(err.message);
      submitBtn.disabled = false;
      submitText.textContent = 'Masuk';
    }
  });

  // sudah login? langsung ke dashboard
  if (Store.token) {
    fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + Store.token } })
      .then(r => { if (r.ok) location.href = '/dashboard'; });
  }
</script>
</body>
</html>
