<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Vincent Pay</title>
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div class="bg-decor"><div class="bg-blob bg-blob-1"></div><div class="bg-blob bg-blob-2"></div></div>
<div class="grid-pattern"></div>

<div style="z-index:1; position:relative; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:3rem 1.25rem;">
  <div class="login-card anim-fade-up" style="width:100%; max-width:28rem;">
    <div style="text-align:center; margin-bottom:1.5rem;">
      <img src="/icon.svg" alt="Logo" style="height:3.5rem; margin:0 auto .75rem; border-radius:.5rem; display:block;">
      <h1 style="font-size:1.15rem; font-weight:500; color:var(--slate-900);">Reset Password</h1>
      <p style="font-size:12px; color:var(--slate-500); margin-top:.375rem;">Buat password baru untuk akun Anda</p>
    </div>

    <div id="alertBox" class="alert alert-error hidden" style="margin-bottom:1rem;"><i class="fas fa-circle-exclamation" style="margin-top:.1rem;"></i><span id="alertText"></span></div>
    <div id="successBox" class="alert alert-success hidden" style="margin-bottom:1rem;"><i class="fas fa-circle-check" style="margin-top:.1rem;"></i><span id="successText"></span></div>

    <form id="resetForm" style="display:flex; flex-direction:column; gap:1rem;">
      <div>
        <label style="display:block; font-size:12.5px; font-weight:500; color:var(--slate-800); margin-bottom:.5rem;">Password Baru</label>
        <div class="form-input-wrapper">
          <input id="passwordInput" type="password" class="form-input" minlength="8" required placeholder="••••••••">
          <button type="button" class="toggle-pass-btn js-toggle-pass"><i class="fas fa-eye" style="font-size:12.5px;"></i></button>
        </div>
      </div>
      <div>
        <label style="display:block; font-size:12.5px; font-weight:500; color:var(--slate-800); margin-bottom:.5rem;">Konfirmasi Password</label>
        <div class="form-input-wrapper">
          <input id="confirmInput" type="password" class="form-input" minlength="8" required placeholder="••••••••">
          <button type="button" class="toggle-pass-btn js-toggle-pass"><i class="fas fa-eye" style="font-size:12.5px;"></i></button>
        </div>
      </div>
      <button type="submit" class="btn-submit" id="submitBtn">Simpan Password Baru</button>
    </form>

    <p style="text-align:center; font-size:12.5px; color:var(--slate-600); margin-top:1.5rem;">
      <a href="/login" class="link-brand">Kembali ke Login</a>
    </p>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const token = params.get('token') || '';

  if (!token) {
    document.getElementById('alertText').textContent = 'Token reset tidak ditemukan pada URL.';
    document.getElementById('alertBox').classList.remove('hidden');
    document.getElementById('resetForm').style.display = 'none';
  }

  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    document.getElementById('alertBox').classList.add('hidden');
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;

    try {
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          token,
          password: document.getElementById('passwordInput').value,
          confirm_password: document.getElementById('confirmInput').value
        })
      });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.message || 'Gagal reset password.');

      document.getElementById('successText').textContent = data.message;
      document.getElementById('successBox').classList.remove('hidden');
      document.getElementById('resetForm').style.display = 'none';
      setTimeout(() => location.href = '/login', 2200);
    } catch (err) {
      document.getElementById('alertText').textContent = err.message;
      document.getElementById('alertBox').classList.remove('hidden');
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
