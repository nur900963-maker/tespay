<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riwayat Webhook - Vincent Pay</title>
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div class="dash-shell" id="shell"></div>

<script src="/js/app.js"></script>
<script src="/js/dashboard.js"></script>
<script>
  bootDashboard('webhook-logs', 'Riwayat Webhook', async () => {
    const c = document.getElementById('content');
    c.innerHTML = `
      <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:1rem; flex-wrap:wrap; margin-bottom:1.25rem;">
        <div>
          <h1 style="font-size:1.15rem; font-weight:600; color:var(--slate-900);">Riwayat Webhook</h1>
          <p style="font-size:12px; color:var(--slate-500); margin-top:.25rem;">
            Notifikasi real-time yang dikirim ke endpoint Anda. Retry otomatis 5x.
          </p>
        </div>
        <a href="/profile" class="btn-secondary" style="font-size:11.5px; padding:.5rem .8rem;">
          <i class="fas fa-gear" style="font-size:10px;"></i> Pengaturan Webhook
        </a>
      </div>

      <div class="dash-card">
        <div class="dash-card-header">
          <div style="display:flex; align-items:center; gap:.5rem;">
            <div class="icon-box icon-fuchsia"><i class="fas fa-webhook"></i></div>
            <span>Log Pengiriman</span>
          </div>
          <button id="refreshBtn" class="btn-secondary" style="font-size:11px; padding:.3rem .6rem;">
            <i class="fas fa-rotate" style="font-size:10px;"></i> Refresh
          </button>
        </div>
        <div class="table-responsive" id="logWrap">
          <div style="padding:2rem; text-align:center; color:var(--slate-400); font-size:12px;">
            <i class="fas fa-spinner fa-spin"></i> Memuat...</div>
        </div>
      </div>

      <div class="info-box" style="margin-top:1.25rem;">
        <div class="info-box-title">Kebijakan Retry Otomatis</div>
        <ul class="info-list">
          <li><i class="fas fa-circle-check"></i><span>Total 5 percobaan: 1 menit → 5 menit → 15 menit → 1 jam → 6 jam.</span></li>
          <li><i class="fas fa-circle-check"></i><span>Response HTTP 2xx dianggap sukses.</span></li>
          <li><i class="fas fa-circle-check"></i><span>Timeout 15 detik per percobaan.</span></li>
        </ul>
      </div>
    `;

    async function load() {
      const wrap = document.getElementById('logWrap');
      try {
        const d = await api('/api/transactions/webhooks/logs?limit=30');
        if (!d.data.length) {
          wrap.innerHTML = '<div style="padding:2.5rem; text-align:center; color:var(--slate-400); font-size:12px;">Belum ada log webhook. Aktifkan webhook di halaman Profil.</div>';
          return;
        }
        wrap.innerHTML = `<table class="data-table">
          <thead><tr><th>ID</th><th>Event</th><th>Status</th><th>HTTP</th><th>Percobaan</th><th>Waktu</th><th></th></tr></thead>
          <tbody>${d.data.map(l => `<tr>
            <td style="font-family:ui-monospace,monospace; font-size:11px;">${l.id}</td>
            <td style="font-size:11.5px;">${l.event}</td>
            <td><span class="badge ${l.state === 'success' ? 'badge-success' : l.state === 'pending' ? 'badge-pending' : 'badge-failed'}">${l.state}</span></td>
            <td style="font-size:11.5px;">${l.status_code || '-'}</td>
            <td style="font-size:11.5px;">${l.attempt || 0}/5</td>
            <td style="font-size:11.5px; color:var(--slate-500); white-space:nowrap;">${fmtDate(l.created_at)}</td>
            <td style="text-align:right;">
              <button class="btn-secondary" style="font-size:10.5px; padding:.25rem .5rem;" data-retry="${l.id}">Retry</button>
            </td>
          </tr>`).join('')}</tbody></table>`;

        wrap.querySelectorAll('[data-retry]').forEach(b => b.addEventListener('click', async () => {
          b.disabled = true;
          b.textContent = '...';
          try {
            const r = await api(`/api/transactions/webhooks/${b.dataset.retry}/retry`, { method: 'POST' });
            toast(r.message, r.success ? 'success' : 'error');
            load();
          } catch (e) {
            toast(e.message, 'error');
            b.disabled = false;
            b.textContent = 'Retry';
          }
        }));
      } catch (e) {
        wrap.innerHTML = `<div class="alert alert-error" style="margin:1rem;">${e.message}</div>`;
      }
    }

    document.getElementById('refreshBtn').addEventListener('click', load);
    load();
  });
</script>
</body>
</html>
